name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The contract is the source; the schema and the types are its output. A
      # contract edited without regenerating fails here rather than shipping a
      # package whose types and schema disagree.
      - run: npm run check:generated
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:command
      - run: npm run build
