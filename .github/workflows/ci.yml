name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The contract is the source; the schema and the types are its output. A
      # contract edited without regenerating fails here rather than shipping a
      # package whose types and schema disagree.
      - run: npm run check:generated
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  reference-app:
    name: Conformance against the reference app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      # The example and the kit are verified against each other on every
      # change: the app builds its manifest through this kit's validator, so a
      # kit change that would break a real app breaks here first.
      - uses: actions/checkout@v4
        with:
          repository: Morelitea/initiative-github
          path: reference
      - run: npm install --no-save ..
        working-directory: reference
      # Scoped to what this job is for: the app's manifest, built and checked
      # through this kit. Its other suites cover the vendor half and want a
      # Postgres — standing one up here would duplicate the app's own CI, and
      # running them without one is what quietly broke this job when the app
      # grew database-backed tests.
      - run: npm run typecheck && npm run manifest && npx vitest run test/manifest.test.ts
        working-directory: reference
