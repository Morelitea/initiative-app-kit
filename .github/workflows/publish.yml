name: Publish

# A release is a version tag. Pushing one publishes that version to npm, after
# the same checks CI runs. npm trusts this workflow as the package's publisher
# (trusted publishing, over GitHub's OIDC token), so no npm token is stored,
# and the package carries provenance naming the commit and workflow that built
# it. Run by hand to publish a tag that already exists.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to publish (for example v0.21.0)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: The tag is the package's version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "tag $TAG does not match package.json $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run check:generated
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:command
      - run: npm run build
      - run: npm publish --provenance --access public
